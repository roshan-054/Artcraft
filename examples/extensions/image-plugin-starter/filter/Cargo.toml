[package]
name = "photocraft-filter-channel-gain"
description = "Independent PhotoCraft filter ABI starter: Channel Gain"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# This example can be copied out of the editor repository and built independently.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
