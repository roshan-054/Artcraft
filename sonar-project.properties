# TODO: change org and key
# SonarQube Cloud CI-based analysis (read by the scanner, not by automatic analysis).
sonar.organization=entorb
sonar.projectKey=entorb_photocraft
sonar.projectName=PhotoCraft
sonar.sourceEncoding=UTF-8

# Rust workspace: libraries, apps, build tooling, example plug-ins, packaging scripts.
sonar.sources=crates,apps,xtask,examples,packaging,scripts,.github/workflows
sonar.tests=crates,apps,xtask

# Test code: integration tests, benches, fuzz targets, out-of-line unit test modules.
# Inline `#[cfg(test)] mod tests` blocks cannot be split out by path and stay in sources.
sonar.test.inclusions=**/tests/**,**/benches/**,**/fuzz/**,**/tests.rs,**/*_tests.rs

# Build output, and test code (kept out of sources so files are not counted twice).
sonar.exclusions=**/target/**,**/dist/**,**/tests/**,**/benches/**,**/fuzz/**,**/tests.rs,**/*_tests.rs

# Examples, out-of-line unit tests, benches and fuzz targets repeat setup on purpose.
sonar.cpd.exclusions=**/examples/**,**/benches/**,**/fuzz/**,**/tests.rs,**/*_tests.rs

# Rust: reports written by .github/workflows/sonar.yml.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json
# The analyzer would also run its own Clippy (root Cargo.toml, default features) and duplicate the
# imported issues; the imported report covers --features heif and all targets.
sonar.rust.clippy.enabled=false
